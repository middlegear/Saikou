plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.anymex.runtimehost'
    compileSdk 37

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'proguard-rules.pro'
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // HTTP / scraping core
    api 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp-brotli:5.5.1'
    implementation 'com.squareup.okhttp3:okhttp-zstd:5.5.1'
    implementation 'com.squareup.okio:okio:3.17.0'
    implementation 'org.jsoup:jsoup:1.21.1'
    implementation 'com.github.Blatzar:NiceHttp:0.4.16'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Dependency injection used by the Tachiyomi/Aniyomi extension API
    api 'uy.kohesive.injekt:injekt-core:1.16.1'

    // Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.9.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.15.2'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Coroutines / Rx
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'

    // AndroidX used by the extension API surface
    api 'androidx.core:core-ktx:1.13.1'
    api 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.compose.runtime:runtime-android:1.8.3'

    // JS engines & extractors used by CloudStream plugins
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
    implementation 'org.mozilla:rhino:1.7.15'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.24.4'
    implementation 'me.xdrop:fuzzywuzzy:1.4.0'
    implementation 'com.uwetrottmann.tmdb2:tmdb-java:2.10.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.11.0'

    implementation "org.jetbrains.kotlin:kotlin-reflect"
}
