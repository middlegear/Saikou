name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: set_vars
        run: |
          VER=$(grep -E -o 'versionName ".*"' app/build.gradle | sed 's/versionName //g' | tr -d '"')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cook KeyStore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > $GITHUB_WORKSPACE/signing-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/signing-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.PASSWORD }} \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=${{ secrets.PASSWORD }} \
            -PAPI_KEY="${{ secrets.KEN_API_KEY }}" \
            -PHOST_URL="${{ secrets.APP_SERVER_URL }}"
        shell: bash

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Saikou-v${{ steps.set_vars.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.set_vars.outputs.version }}
          name: Saikou ${{ steps.set_vars.outputs.version }}
          body_path: stable.md
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/Saikou-v${{ steps.set_vars.outputs.version }}.apk