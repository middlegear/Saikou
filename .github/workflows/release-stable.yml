name: Stable Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set variables
        id: set_vars
        run: |
          VER=$(grep -E -o 'versionName ".*"' app/build.gradle | sed 's/versionName //g' | tr -d '"')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set -euo pipefail
          ARGS=(
            -PAPI_KEY="${{ secrets.KEN_API_KEY }}"
            -PHOST_URL="${{ secrets.APP_SERVER_URL }}"
          )
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ] && [ -n "${{ secrets.PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/signing-key.jks"
            ARGS+=(
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing-key.jks"
              -Pandroid.injected.signing.store.password="${{ secrets.PASSWORD }}"
              -Pandroid.injected.signing.key.alias=key0
              -Pandroid.injected.signing.key.password="${{ secrets.PASSWORD }}"
            )
          else
            echo "Signing secrets are not configured in this repository; building an unsigned release APK."
          fi
          ./gradlew assembleRelease "${ARGS[@]}"
        shell: bash

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Saikou-v${{ steps.set_vars.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          tag_name: v${{ steps.set_vars.outputs.version }}
          name: Saikou ${{ steps.set_vars.outputs.version }}
          body_path: stable.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/Saikou-v${{ steps.set_vars.outputs.version }}.apk
